# DeepSeek Harness (DSH) 接入本地 Ollama 的配置片段
# 追加到 %USERPROFILE%\.dsh\profiles\desktop\cordis.patch.yml 末尾
# （若已存在 id: llm-pi-ai 的段，直接替换该段）

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ollama-local:
        displayName: 本地 Ollama
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        headers:
          Authorization: "Bearer ollama"   # Ollama 无密钥，占位 token 绕过 pi-ai 强制鉴权
        models:
          - id: qwen3-30b-a3b
            name: Qwen3-30B-A3B（高质量 Agent）
            contextWindow: 16384
            maxTokens: 8192
            reasoningEfforts: false
          - id: qwen3-8b
            name: Qwen3-8B（快速）
            contextWindow: 16384
            maxTokens: 8192
          - id: qwen3-8b-long
            name: Qwen3-8B（32K 长文本）
            contextWindow: 32768
            maxTokens: 8192

# 若想将本地模型设为默认（新会话默认走本地，不消耗 DeepSeek API 额度），
# 再把 cordis.patch.yml 顶部的 agent-default-model 改为：
#
# - id: agent-default-model
#   name: "@deepseek-ai/dsh-agent-default-model"
#   config:
#     provider: ollama-local
#     model: qwen3-30b-a3b
